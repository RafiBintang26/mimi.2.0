<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun Baru - Daily Hydration Tracker 💧</title>
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%230284c7'><path d='M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z'/></svg>">
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <!-- Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .auth-page-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem 1.25rem;
        }
        .auth-card {
            width: 100%;
            max-width: 480px;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 2.5rem 2rem;
            box-shadow: var(--shadow-lg);
        }
        .auth-header {
            text-align: center;
            margin-bottom: 1.75rem;
        }
        .auth-header .brand-icon {
            margin: 0 auto 0.85rem;
            width: 48px;
            height: 48px;
            font-size: 1.5rem;
        }
        .auth-header h2 {
            font-size: 1.75rem;
            color: var(--text-primary);
            margin-bottom: 0.35rem;
        }
        .auth-header p {
            color: var(--text-secondary);
            font-size: 0.92rem;
        }
        .device-info-pill {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            padding: 0.5rem 0.85rem;
            border-radius: var(--radius-md);
            font-size: 0.8rem;
            color: #166534;
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body>

    <div class="auth-page-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <a href="index.html" class="brand-icon">💧</a>
                <h2>Buat Akun Baru</h2>
                <p>Mulai kebiasaan minum air teratur hari ini</p>
            </div>

            <!-- Device Security Status Alert Box -->
            <div id="device-status-alert" class="device-alert-box" style="display: none;">
                <!-- Dynamically populated by js/auth.js -->
            </div>

            <form id="register-form">
                <div class="form-group">
                    <label class="form-label" for="reg-fullname">Nama Lengkap <span class="req">*</span></label>
                    <div class="input-icon-wrapper">
                        <span class="icon">📝</span>
                        <input type="text" id="reg-fullname" class="form-input" placeholder="Contoh: Rafi Pratama" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="reg-username">Username <span class="req">*</span></label>
                    <div class="input-icon-wrapper">
                        <span class="icon">@</span>
                        <input type="text" id="reg-username" class="form-input" placeholder="username_unik" required autocomplete="username">
                    </div>
                    <div class="form-hint">Hanya huruf, angka, dan garis bawah (_). Minimal 3 karakter.</div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="reg-email">Alamat Email <span class="req">*</span></label>
                    <div class="input-icon-wrapper">
                        <span class="icon">✉️</span>
                        <input type="email" id="reg-email" class="form-input" placeholder="nama@email.com" required autocomplete="email">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="reg-password">Kata Sandi <span class="req">*</span></label>
                    <div class="input-icon-wrapper">
                        <span class="icon">🔒</span>
                        <input type="password" id="reg-password" class="form-input" placeholder="Minimal 6 karakter" required autocomplete="new-password">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="reg-confirm-password">Konfirmasi Kata Sandi <span class="req">*</span></label>
                    <div class="input-icon-wrapper">
                        <span class="icon">🔐</span>
                        <input type="password" id="reg-confirm-password" class="form-input" placeholder="Ulangi kata sandi" required autocomplete="new-password">
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 1.75rem;">
                    <label style="display: flex; align-items: flex-start; gap: 0.65rem; font-size: 0.85rem; color: var(--text-secondary); cursor: pointer;">
                        <input type="checkbox" id="reg-terms" required style="margin-top: 0.2rem;">
                        <span>Saya menyetujui ketentuan penggunaan dan memahami aturan keamanan <strong>1 perangkat HP hanya dapat digunakan untuk 1 akun</strong>.</span>
                    </label>
                </div>

                <button type="submit" id="register-submit-btn" class="btn btn-primary btn-block btn-lg">
                    Daftar Akun & Hubungkan HP 💧
                </button>
            </form>

            <div style="text-align: center; margin-top: 1.75rem; font-size: 0.9rem; color: var(--text-secondary);">
                Sudah memiliki akun? <a href="login.html" style="font-weight: 700;">Masuk di Sini</a>
            </div>

            <div style="text-align: center; margin-top: 1rem;">
                <a href="index.html" style="font-size: 0.82rem; color: var(--text-muted);">← Kembali ke Halaman Utama</a>
            </div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/device.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
